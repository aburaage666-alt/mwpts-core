excluded_allowance_rules:
  - overtime_premium_pay
  - night_premium_pay
  - holiday_premium_pay
  - commuting_allowance
  - family_allowance
premium_pay_rules:
  overtime_rate: 0.25
  night_rate: 0.25
  holiday_rate: 0.35
fixed_overtime_handling:
  enabled: true
  default_review_result: "GREY"
  required_fields:
    - has_fixed_overtime_pay
    - fixed_overtime_amount
    - fixed_overtime_hours_included
    - fixed_overtime_breakdown_available
deduction_rules:
  high_deduction_threshold: 0.3
  review_threshold: 0.3  # Deprecated alias; use high_deduction_threshold in new implementations.
  denominator: "base_wage"
  categories:
    - housing
    - meals
    - tools_uniform
    - recruitment_related
    - debt_repayment
tolerance_amount: 10.0
support_contacts:
  - name: "Labour Standards Inspection Office"
    url: "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/location.html"
  - name: "Houterasu / legal consultation"
    url: "https://www.houterasu.or.jp/"
language_pack_codes:
  - ja-easy
  - vi
  - en
native_review_notice:
  ko: "Korean translations are draft and require native-speaker review before worker-facing release."
  zh-TW: "Traditional Chinese translations are draft and require native-speaker review before worker-facing release."
metadata:
  framework: "MWPTS Core v0.2.1"
  author: "Kunihisa Koyama (Kuni)"
